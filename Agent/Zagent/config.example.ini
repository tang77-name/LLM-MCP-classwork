; Zagent 配置模板：复制为 config.ini 后填入真实信息
; 优先级：环境变量 > 本文段 > 内置默认值
; （首次运行若当前目录没有 config.ini，会自动生成一份带 mock 信息的完整配置）
[llm]
base_url = https://api.deepseek.com
api_key = sk-xxxx
model_name = deepseek-chat

[agent]
temperature = 0.7
timeout = 60
max_tool_rounds = 8
; Mermaid 架构图默认输出目录，留空表示 <当前工作目录>/diagrams
diagram_dir =
; 本地 Skill 市场目录，留空表示 <当前工作目录>/market
; 也可用环境变量 ZAGENT_MARKET_DIR
market_dir =
; 模型上下文窗口大小（token）：0 / 留空 = 未知，界面按默认 128k 显示并标注“默认”
; 占用达到窗口的 80% 时会警告并暂停输入，需执行 /compact 压缩后才能继续
; 也可用环境变量 ZAGENT_CONTEXT_WINDOW
context_window = 0

[search]
; 百度千帆 API Key（searchWeb 联网搜索使用）
; 获取：https://console.bce.baidu.com/iam/#/iam/apikey/list
; 也可用环境变量 BAIDU_QIANFAN_API_KEY
baidu_qianfan_api_key = bce-v3/xxxx
; 搜索请求超时（秒），也可用环境变量 ZAGENT_SEARCH_TIMEOUT
timeout = 20
; 模型未指定 top_k 时默认返回的网页条数（1..50）
default_top_k = 10
; 单条搜索摘要的最大字符数（控制上下文占用）
max_snippet_chars = 600

[web]
; Codex 风格 Web 前端（python main.py --ui web）
; 监听地址与端口，也可用 ZAGENT_WEB_HOST / ZAGENT_WEB_PORT
host = 127.0.0.1
port = 8787
; 启动后是否自动打开浏览器（1/0），也可用 ZAGENT_WEB_OPEN_BROWSER
open_browser = 1

[tools]
; 以下为工具行为参数：留空或整段缺失时按内置默认值执行
; fetchWeb：下载超时（秒）
fetch_timeout = 30
; fetchWeb：单页 HTML 下载上限（字节，默认 8MB）
fetch_max_bytes = 8388608
; fetchWeb：返回正文最大字符数
fetch_max_chars = 20000
; file0ps：单次读取最大字符数
file_read_chars = 8000
; file0ps：list 最多展示条目数
file_list_entries = 500
; RunCli：默认执行超时（秒）
cli_timeout = 60
; RunCli：允许的最大超时（秒）
cli_max_timeout = 600
; RunCli：输出截断长度（字符）
cli_max_chars = 8000
; recallContext：返回条数
recall_limit = 5
; recallContext：结果长度上限（字符）
recall_max_chars = 3000

[mcp]
; 单个 MCP Server 连接超时（秒）
connect_timeout = 20
; MCP 工具调用超时（秒）
call_timeout = 60
